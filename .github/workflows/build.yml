name: Build GRID0 Setup

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file exe
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: GRID0Setup-win-x64
          path: dist/GRID0Setup.exe
